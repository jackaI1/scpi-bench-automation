[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scpi-bench-automation"
version = "0.1.0"
description = "Reproducible simulated bench sweeps and thermal soak reports"
requires-python = ">=3.11"
dependencies = ["pyvisa>=1.15,<2", "pyvisa-sim>=0.7.1,<0.8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
scpi-bench = "scpi_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scpi_bench = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
